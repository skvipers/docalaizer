services:
  postgres:
    image: postgres:16-alpine
    container_name: docalaizer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docalaizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docalaizer_dev}
      POSTGRES_DB: ${POSTGRES_DB:-docalaizer}
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    volumes:
      - docalaizer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docalaizer} -d ${POSTGRES_DB:-docalaizer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: docalaizer-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-docalaizer}:${POSTGRES_PASSWORD:-docalaizer_dev}@postgres:5432/${POSTGRES_DB:-docalaizer}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      LOCUGARD_URL: ${LOCUGARD_URL:-}
      LOCUGARD_ORIGIN: ${LOCUGARD_ORIGIN:-}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: docalaizer-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  docalaizer_pgdata:
